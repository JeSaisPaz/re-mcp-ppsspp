name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: build (node ${{ matrix.node }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Setup Python (for the optional Ghidra sidecar)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install
        run: npm ci --ignore-scripts

      - name: Type-check & build
        run: npm run build

      - name: Syntax-check the Ghidra sidecar script
        # Can't exercise the actual pyghidra/Ghidra calls in CI (no Ghidra
        # install), but this catches plain Python syntax errors.
        run: python -m py_compile scripts/ghidra_sidecar.py

      - name: Run tests
        run: npm test

      - name: Verify shebang and bin
        shell: bash
        run: |
          head -1 dist/index.js | grep -q '^#!/usr/bin/env node$'
          test -f dist/index.js
          test -f dist/ppsspp.js
          test -f dist/tools/index.js
          echo "build artifacts OK"

  ci-ok:
    name: ci-ok
    needs: build
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Verify all matrix builds passed
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "matrix build did not fully succeed: ${{ needs.build.result }}"
            exit 1
          fi
          echo "all matrix builds passed"
